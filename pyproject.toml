[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "Modular, explicit, reproducible implementation of classical SAINT and IRIS algorithms."
authors = [
    { name = "Erik Larsen" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
packages = ["orion"]

[tool.setuptools.package-dir]
orion = "python/orion"

[tool.pytest.ini_options]
testpaths = ["tests"]
env = { MPLBACKEND = "Agg" }

[tool.setuptools.exclude-package-data]
"*" = ["coherence.md"]
